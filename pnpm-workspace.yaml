# Monorepo de duas frentes sobre o mesmo Supabase: a web em Next.js e,
# mais tarde, a app em Expo. Os pacotes partilhados vivem em packages/.
#
# pnpm workspaces e nada mais: o Turborepo e o Nx resolvem caching de
# builds e grafos de dependências em monorepos com dezenas de pacotes, e
# aqui há dois apps e um punhado de pacotes pequenos. Se um dia o build
# passar dos dois minutos, acrescenta-se Turborepo em meia hora.
packages:
  - 'apps/*'
  - 'packages/*'
# O pnpm bloqueia scripts de instalação por omissão, o que é bom. Estes
# três são precisos e são conhecidos:
#   esbuild       — binário que o Vitest usa para compilar os testes
#   sharp         — bindings nativos da otimização de imagens do Next
#   unrs-resolver — resolução de imports do ESLint
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# O pnpm segura pacotes acabados de publicar durante uns dias, como defesa
# contra pacotes comprometidos. O SDK da Expo move-se em bloco, por isso
# são muitas de uma vez — foram acrescentadas pelo próprio `expo install`.
#
# O projeto está no SDK 56 e não no 57, de propósito: o 57 é recente ao
# ponto de a app Expo Go publicada nas lojas ainda não o abrir, e sem o
# Expo Go não há como experimentar a app sem instalar o SDK do Android.
minimumReleaseAgeExclude:
  - '@expo/cli@56.1.24'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - expo-asset@56.0.23
  - expo-constants@56.0.24
  - expo@56.0.20
  - '@expo/metro-runtime@56.0.20'
  - expo-router@56.2.19
  - '@expo/config-plugins@56.0.15'
  - '@expo/prebuild-config@56.0.22'
  - '@expo/router-server@56.0.18'
  - expo-file-system@56.0.10
  - expo-modules-autolinking@56.0.22
  - expo-modules-core@56.0.24
  - expo-server@56.0.6
  - '@expo/ui@56.0.26'
  - expo-linking@56.0.17
